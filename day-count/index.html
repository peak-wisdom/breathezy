<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Days Until</title>
  <style>
    .site-nav {
  position: relative;
  z-index: 100;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 6px;
  width: 100%;
  max-width: 560px;
  margin: 0 0 24px;
  background: #102720;
  border: 1px solid #ffffff30;
  border-radius: 14px;
}

.site-nav a {
  padding: 10px 12px;
  white-space: nowrap;
  border-radius: 9px;
  color: #eef8f4;
  text-decoration: none;
  font: 14px system-ui, sans-serif;
}

.site-nav a:hover,
.site-nav a[aria-current="page"] {
  background: #b4eed5;
  color: #12362b;
}

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #eef8f4;
      background: radial-gradient(circle at top, #214c45, #101c23);
    }

    main {
      width: 100%;
      max-width: 820px;
      padding: 36px;
      text-align: center;
      background: #ffffff09;
      border: 1px solid #ffffff20;
      border-radius: 24px;
    }

    h1 { margin-top: 0; font-weight: 500; }
    p { color: #b4c9c2; line-height: 1.6; }
    label { display: block; margin: 24px 0 10px; }

    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font: inherit;
    }

    input {
      color-scheme: dark;
      background: #102720;
      color: white;
      border: 1px solid #ffffff40;
      cursor: pointer;
    }

    button {
      margin-top: 12px;
      border: none;
      background: #b4eed5;
      color: #12362b;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #d0f8e7; }

    input:focus-visible, button:focus-visible {
      outline: 3px solid #b4eed5;
      outline-offset: 4px;
    }

    #result { margin-top: 28px; min-height: 130px; }
    #number { font-size: 76px; font-weight: 300; line-height: 1.2; }
    #message { margin-top: 8px; }
    #selectedDate { font-size: 14px; }
    @media (max-width: 420px) {
      body { padding: 16px; }
      main { padding: 28px 18px; }
      .site-nav a { padding: 10px; font-size: 13px; }
    }
.countdowns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;text-align:left;margin:28px 0}.countdown-card{padding:22px;border:1px solid #ffffff25;border-radius:20px;background:#ffffff05;min-width:0}.card-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.card-heading h2{font-size:16px;font-weight:500;margin:0;color:#b4c9c2}.remove{width:auto;padding:8px 10px;margin:0;font-size:12px;font-weight:400;background:transparent;color:#b4c9c2;border:1px solid #ffffff30}.remove:hover{background:#ffffff10}.countdown-card label{font-size:13px;margin:18px 0 8px}.countdown-card input{min-width:0}.countdown-card input[type="text"]{cursor:text}.result{text-align:center;margin-top:24px}.day-number{font-size:60px;font-weight:300;line-height:1.2;font-variant-numeric:tabular-nums}.date-caption{font-size:12px;margin:10px 0 0}.day-message{margin-top:6px;color:#b4c9c2;font-size:14px}.add-date{display:inline-flex;gap:10px;align-items:center;justify-content:center;width:auto;min-width:180px}.plus{font-size:24px;line-height:1}.storage-note,.empty{font-size:13px}.undo{width:auto;padding:8px 12px;margin:0 0 12px;background:transparent;color:#b4eed5;border:1px solid #ffffff40}[hidden]{display:none!important}@media(max-width:640px){.countdowns{grid-template-columns:1fr}.countdown-card{padding:20px}.day-number{font-size:64px}}
</style>
<script src="../theme.js?v=1"></script><link rel="stylesheet" href="../theme.css?v=2"></head>
<body data-app="day-count">
  <nav class="site-nav" aria-label="Main navigation"><a href="../">Home</a><a href="../breathing/">Breathing</a><a href="../day-count/" aria-current="page">Day Countdown</a><a href="../focus-timer/">Focus Timer</a><a href="../grounding/">Grounding</a><a href="../memory/">Memory Game</a></nav><div class="theme-toolbar"><span id="theme-notice" role="status"></span><button id="theme-toggle" type="button" aria-label="Switch to light theme">Light theme</button></div>
  <main>
    <h1>Something to look forward to.</h1>
    <p>Big milestones or little moments. Give each date a name and keep it in view.</p>
    <div id="countdowns" class="countdowns" aria-label="Your countdowns"></div>
    <p id="empty" class="empty" hidden>No dates yet. Add something to look forward to.</p>
    <button id="undo" class="undo" type="button" hidden>Undo remove</button><br>
    <button id="addDate" class="add-date" type="button"><span class="plus" aria-hidden="true">+</span> Add date</button>
    <p id="storageNotice" class="storage-note" role="status">Dates and labels save automatically in this browser.</p>
  </main>

  <script src="countdowns.js"></script>
<script src="../timers.js?v=3"></script></body>
</html>
